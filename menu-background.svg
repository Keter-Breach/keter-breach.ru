<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="air" x2="0" y2="1"><stop stop-color="#202729"/><stop offset=".42" stop-color="#0b1012"/><stop offset="1" stop-color="#020303"/></linearGradient>
 <linearGradient id="leftWall" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#080c0d"/><stop offset=".48" stop-color="#272e30"/><stop offset=".82" stop-color="#111719"/><stop offset="1" stop-color="#07090a"/></linearGradient>
 <linearGradient id="rightWall" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#080b0c"/><stop offset=".42" stop-color="#202729"/><stop offset="1" stop-color="#090c0d"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#252b2c"/><stop offset=".3" stop-color="#151a1b"/><stop offset="1" stop-color="#030405"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080b0c"/><stop offset=".12" stop-color="#3b4244"/><stop offset=".2" stop-color="#171c1e"/><stop offset=".53" stop-color="#343a3c"/><stop offset=".72" stop-color="#101415"/><stop offset=".9" stop-color="#42494a"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
 <linearGradient id="doorL" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#080b0c"/><stop offset=".5" stop-color="#42494b"/><stop offset=".58" stop-color="#22282a"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
 <linearGradient id="doorR" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#090b0c"/><stop offset=".42" stop-color="#303638"/><stop offset=".7" stop-color="#151a1b"/><stop offset="1" stop-color="#050607"/></linearGradient>
 <radialGradient id="redGlow"><stop stop-color="#ff342b" stop-opacity=".8"/><stop offset=".34" stop-color="#a41412" stop-opacity=".28"/><stop offset="1" stop-color="#a41412" stop-opacity="0"/></radialGradient>
 <radialGradient id="coldGlow"><stop stop-color="#b9d1c6" stop-opacity=".2"/><stop offset="1" stop-color="#b9d1c6" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".1" stop-color="#000" stop-opacity="0"/><stop offset=".65" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="12" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="haze"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="concrete" width="120" height="96" patternUnits="userSpaceOnUse"><path d="M0 24H120M22 0V24M82 24V96M0 68H82" fill="none" stroke="#9da7a5" stroke-opacity=".07" stroke-width="2"/><path d="M7 12l18 -3M67 54l13 4M96 82l15 -2" stroke="#b5bdb8" stroke-opacity=".07" stroke-width="1"/></pattern>
 <pattern id="floorLines" width="160" height="110" patternUnits="userSpaceOnUse"><path d="M0 0H160M0 0V110" stroke="#a4afac" stroke-opacity=".07" stroke-width="2"/></pattern>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#d8e1dc" opacity=".09"/></pattern>
</defs>
