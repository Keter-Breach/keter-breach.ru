<!-- photorealism pass: layered mineral stains, damp concrete, oxidized steel and lens haze -->
<defs>
 <filter id="wallPatina" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018 0.09" numOctaves="4" seed="27" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono" result="contrast"><feFuncR type="gamma" amplitude="1.7" exponent="1.5" offset="-.25"/><feFuncG type="gamma" amplitude="1.7" exponent="1.5" offset="-.25"/><feFuncB type="gamma" amplitude="1.7" exponent="1.5" offset="-.25"/></feComponentTransfer>
  <feBlend in="SourceGraphic" in2="contrast" mode="soft-light"/>
 </filter>
 <filter id="microNoise">
  <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="2" seed="81" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="g"/>
  <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
 </filter>
 <linearGradient id="wetFloor" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#a8b7b1" stop-opacity=".13"/><stop offset=".35" stop-color="#64716e" stop-opacity=".04"/><stop offset="1" stop-color="#030405" stop-opacity="0"/></linearGradient>
 <radialGradient id="lensMist"><stop stop-color="#b9c9c1" stop-opacity=".10"/><stop offset="1" stop-color="#b9c9c1" stop-opacity="0"/></radialGradient>
</defs>
<!-- broad irregular damp marks and concrete pores follow the perspective planes -->
<g opacity=".24" filter="url(#wallPatina)">
 <path d="M0 90L582 326V786L0 1080Z" fill="#89918e"/>
 <path d="M1920 35L1338 326V786L1920 1080Z" fill="#747e7b"/>
</g>
