<rect width="1920" height="1080" fill="#9eaaa3" opacity=".10" filter="url(#microNoise)"/>
<ellipse cx="450" cy="500" rx="420" ry="290" fill="url(#lensMist)"/>
<ellipse cx="1480" cy="600" rx="360" ry="280" fill="url(#lensMist)" opacity=".6"/>

<!-- surveillance artifacts -->
<rect width="1920" height="1080" fill="url(#vignette)"/>
<rect width="1920" height="1080" fill="#8aaca0" opacity=".025" filter="url(#grain)"/>
<rect width="1920" height="1080" fill="url(#scan)" opacity=".25"/>
