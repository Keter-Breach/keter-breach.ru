<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171b1c"/><stop offset=".55" stop-color="#090d0f"/><stop offset="1" stop-color="#020304"/></linearGradient>
 <linearGradient id="wall" x2="1" y2=".3"><stop stop-color="#101517"/><stop offset=".5" stop-color="#303537"/><stop offset="1" stop-color="#080b0c"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#202527"/><stop offset="1" stop-color="#030405"/></linearGradient>
 <linearGradient id="door" x2="1"><stop stop-color="#161a1b"/><stop offset=".4" stop-color="#424648"/><stop offset=".65" stop-color="#171b1d"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
 <radialGradient id="redGlow"><stop stop-color="#ff2525" stop-opacity=".72"/><stop offset="1" stop-color="#d00b08" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".88"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#d4e2db" opacity=".075"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<!-- corridor receding in perspective -->
<path d="M0 0H1600L1140 300H510Z" fill="#15191b"/>
<path d="M0 0L510 300V700L0 900Z" fill="url(#wall)"/>
<path d="M1600 0L1140 300V700L1600 900Z" fill="#171c1e"/>
<path d="M510 300H1140V700H510Z" fill="#07090a"/>
<path d="M0 900L510 700H1140L1600 900Z" fill="url(#floor)"/>
<g stroke="#667074" stroke-opacity=".23" fill="none" stroke-width="3"><path d="M0 90L510 330M0 200L510 390M0 330L510 455M0 470L510 520M0 620L510 590"/><path d="M1600 90L1140 330M1600 200L1140 390M1600 330L1140 455M1600 470L1140 520M1600 620L1140 590"/><path d="M220 900L670 700M520 900L790 700M1080 900L910 700M1390 900L1030 700"/></g>
<!-- open elevator -->
<rect x="800" y="180" width="480" height="580" fill="#050606" stroke="#505658" stroke-width="12"/>
<rect x="842" y="218" width="398" height="500" fill="#131719" stroke="#242a2c" stroke-width="8"/>
<path d="M842 218L1010 242V708L842 718Z" fill="url(#door)" stroke="#5b6061" stroke-width="4"/>
<path d="M1240 218L1085 242V708L1240 718Z" fill="url(#door)" stroke="#4d5355" stroke-width="4"/>
<path d="M1010 242L1085 242V708L1010 708Z" fill="#020303"/>
<path d="M1010 242L1085 242M1010 708L1085 708" stroke="#8a2520" stroke-opacity=".6" stroke-width="4"/>
<ellipse cx="1050" cy="280" rx="190" ry="170" fill="url(#redGlow)" filter="url(#blur)"/>
<rect x="1024" y="265" width="48" height="13" fill="#ff3931" opacity=".9"/>
<rect x="1024" y="265" width="48" height="13" fill="#ff2525" opacity=".7" filter="url(#blur)"/>
<path d="M850 720L1008 705L1087 705L1235 720L1370 900H670Z" fill="#131719" opacity=".85"/>
<path d="M800 760L1008 720L1087 720L1280 760" fill="none" stroke="#8d2a24" stroke-opacity=".55" stroke-width="5"/>
<!-- call panel -->
<rect x="1320" y="375" width="78" height="190" fill="#0a0c0d" stroke="#555b5d" stroke-width="4"/>
<rect x="1340" y="402" width="38" height="24" fill="#a81816"/><circle cx="1359" cy="466" r="10" fill="#8b1b18"/><circle cx="1359" cy="508" r="10" fill="#172d22"/>
<!-- weak ceiling light -->
<path d="M510 85L830 85L865 100L530 100Z" fill="#a5a7a1" opacity=".45"/>
<path d="M550 100L780 100L820 120L510 120Z" fill="#a9afb0" opacity=".12"/>
<!-- reflected puddles -->
<path d="M530 820L735 740L820 747L620 860Z" fill="#a2a9a5" opacity=".12"/>
<path d="M950 850L1120 730L1160 740L1030 890Z" fill="#d22a21" opacity=".18"/>
<g stroke="#aeb8b6" stroke-opacity=".1" fill="none"><path d="M30 780L480 670M100 820L520 690M1180 740L1570 820M1100 780L1510 875"/></g>
<!-- CCTV overlay and interference -->
<rect x="16" y="16" width="1568" height="868" fill="none" stroke="#7d9187" stroke-opacity=".36" stroke-width="2"/>
<path d="M16 48H250M16 48V16M1350 16H1584V48M16 852V884H300M1300 884H1584V852" stroke="#8aa59a" stroke-opacity=".4" fill="none" stroke-width="2"/>
<rect width="1600" height="900" fill="url(#scan)"/>
<rect width="1600" height="900" fill="#000" opacity=".13" filter="url(#grain)"/>
<rect width="1600" height="900" fill="url(#vignette)"/>
</svg>