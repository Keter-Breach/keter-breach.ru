name: Build Windows desktop app

on:
  pull_request:
    branches: [main, feat/windows-desktop-build]
  push:
    branches: [feat/windows-desktop-build, fix/offline-exe-build]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run smoke tests
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-keter-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
