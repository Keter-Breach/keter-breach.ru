name: Godot Prototype Smoke Test

on:
  push:
    branches: [feat/godot-prototype]
    paths:
      - "godot-prototype/**"
      - ".github/workflows/godot-smoke.yml"
  pull_request:
    paths:
      - "godot-prototype/**"
      - ".github/workflows/godot-smoke.yml"
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        shell: bash
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import project and parse scripts
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot-prototype --quit
      - name: Launch scene headlessly
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --path godot-prototype --quit-after 5
