name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feat/keter-android-apk-v2
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configure preinstalled Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run project smoke tests
        run: npm test
      - name: Install Capacitor and asset tools
        run: npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3 sharp
      - name: Generate Android icon source images
        run: node scripts/generate-android-icons.mjs
      - name: Generate Android project
        run: npx cap add android
      - name: Lock Android app to landscape
        run: node scripts/set-android-landscape.mjs
      - name: Generate native launcher icons
        run: npx capacitor-assets generate --android
      - name: Set APK version
        run: node scripts/set-android-version.mjs
      - name: Prepare and sync game assets
        run: npm run android:prepare
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PROJECT-KETER-Android-APK-06
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
