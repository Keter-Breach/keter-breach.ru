<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project: Keter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff66;
    }

    .hidden { display: none !important; }

    /* === ТЕКСТОВЫЙ ЭКРАН === */
    #text-game {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle, #10121a 0%, #050508 100%);
    }

    .card {
      background: rgba(10, 15, 20, 0.9);
      border: 1px solid #00ff66;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
      padding: 30px;
      max-width: 650px;
      width: 100%;
      border-radius: 4px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #ff3333;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
      letter-spacing: 2px;
    }

    .location-tag {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    p#description {
      font-size: 15px;
      line-height: 1.6;
      color: #cccccc;
      margin-bottom: 30px;
    }

    #buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      background: #0d1a12;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    button:hover {
      background: #00ff66;
      color: #050508;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    /* === 3D ЭКРАН И ИНТЕРФЕЙС === */
    #three-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #00ff66;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 4px #00ff66;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 15px 20px;
      background: rgba(5, 5, 8, 0.85);
      border: 1px solid rgba(0, 255, 102, 0.4);
      color: #00ff66;
      font-size: 13px;
      pointer-events: none;
      border-radius: 4px;
    }

    #inventory-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      padding: 12px 18px;
      background: rgba(5, 5, 8, 0.85);
      border: 1px solid rgba(0, 255, 102, 0.4);
      font-size: 12px;
      pointer-events: none;
    }

    #minimap-canvas {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 1px solid #00ff66;
      background: rgba(0, 10, 5, 0.8);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="text-game">
    <div class="card">
      <h1 id="chapter-title">ГЛАВА 1: НАРУШЕНИЕ СОДЕРЖАНИЯ</h1>
      <div class="location-tag">ЛОКАЦИЯ: <span id="current-location">СЕКТОР D-12</span></div>
      <p id="description">Загрузка данных...</p>
      <div id="buttons-container"></div>
      <div style="margin-top:20px; font-size:11px; color:#555;">ПОПЫТКА: <span id="loop-count">#1</span></div>
    </div>
  </div>

  <div id="three-container" class="hidden">
    <div class="crosshair"></div>
    
    <div id="hud">
      <div style="font-weight:bold; color:#fff; margin-bottom:5px;">СЕКТОР ЛЗС-09 [10 ЗОН]</div>
      <div>ЗАРЯД ФОНАРЯ: <span id="battery-level" style="color:#fff;">100%</span></div>
      <div style="font-size: 11px; margin-top: 8px; color: #aaa; line-height: 1.4;">
        [W,A,S,D] — Шаг | [Shift] — Бег<br>
        [F] — Фонарик | [E] — Взаимодействие
      </div>
    </div>

    <div id="inventory-hud">
      <div style="color:#aaa; margin-bottom:3px;">ИНВЕНТАРЬ:</div>
      <div id="inv-items">Пусто</div>
    </div>

    <!-- Радар / Мини-карта -->
    <canvas id="minimap-canvas" width="120" height="120"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
