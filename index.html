<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCP: Фикали Геймс</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>SCP FACILITY SIMULATOR</h1>
      <div id="status-bar">
        <span>Локация: <strong id="current-location">Загрузка...</strong></span>
        <span>Здоровье: <strong id="health">100 HP</strong></span>
      </div>
    </header>

    <main id="screen">
      <p id="description">Вы приходите в себя на жесткой кушетке...</p>
    </main>

    <section id="controls">
      <h3>Доступные переходы:</h3>
      <div id="buttons-container" class="btn-grid"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
