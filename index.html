<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCP: VHS EDITION</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- VHS Помехи и Оверлеи -->
  <div class="vhs-scanlines"></div>
  <div class="vhs-noise"></div>
  <div class="vhs-vignette"></div>
  <div class="vhs-tracking-line"></div>

  <!-- Текстовая Часть -->
  <div id="text-game" class="game-container">
    <header>
      <div class="vhs-tag">● REC 00:04:12 [TAPE_01]</div>
      <h1>SCP FACILITY SIMULATOR</h1>
      <div id="status-bar">
        <span>Локация: <strong id="current-location">Загрузка...</strong></span>
        <span>Цикл: <strong id="loop-count">#1</strong></span>
      </div>
    </header>

    <main id="screen">
      <p id="description">Вы приходите в себя...</p>
    </main>

    <section id="controls">
      <h3>Доступные действия:</h3>
      <div id="buttons-container" class="btn-grid"></div>
    </section>
  </div>

  <!-- 3D Часть -->
  <div id="three-container" class="hidden">
    <div class="vhs-tag ui-overlay">● REC 00:04:13 [TAPE_02] | D-CLASS ESCAPE</div>
    <div id="battery-hud">ФОНАРИК [F]: <span id="battery-level">100%</span></div>
    <div id="crosshair">+</div>
    <div id="instructions">Кликните по экрану, чтобы начать (WASD — Ходьба, F — Фонарик)</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
