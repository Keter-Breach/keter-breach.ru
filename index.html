<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project: Keter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #d9dcd7;
    --ink: #16181a;
    --red: #b3201a;
    --steel: #101213;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --head: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--steel);
    font-family: var(--mono);
    color: #00ff66;
  }

  .hidden { display: none !important; }

  /* === МЕНЮ: ДОСЬЕ ИНЦИДЕНТА === */
  #text-game {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
    overflow-y: auto;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 7px),
      linear-gradient(#1a1c1e, #0d0e0f);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: auto;
    background: linear-gradient(#dcdfda, #d2d5d0);
    color: var(--ink);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 2px 0 rgba(255, 255, 255, 0.25) inset;
    text-align: left;
  }

  .dossier-bar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(18px, 5vw, 32px);
    background: var(--ink);
    color: var(--paper);
    font: 500 13px/1 var(--head);
    letter-spacing: 0.12em;
  }

  .stamp {
    position: static;
    display: inline-block;
    margin: 18px clamp(18px, 5vw, 32px) 0;
    padding: 4px 10px;
    border: 3px solid var(--red);
    color: var(--red);
    font: 700 17px/1.1 var(--head);
    letter-spacing: 0.08em;
    mix-blend-mode: multiply;
    transform: rotate(-6deg);
    animation: slam 0.5s 0.35s both;
  }

  @keyframes slam {
    0%   { opacity: 0;    transform: rotate(-6deg) scale(1.8); }
    60%  { opacity: 0.95; transform: rotate(-6deg) scale(0.96); }
    100% { opacity: 0.85; transform: rotate(-6deg) scale(1); }
  }

  .card-body { padding: 14px clamp(18px, 5vw, 32px) clamp(20px, 5vw, 30px); }

  h1 {
    font: 700 clamp(24px, 6vw, 32px)/1.1 var(--head);
    color: var(--ink);
    letter-spacing: 0.02em;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 4px solid var(--ink);
  }

  .meta {
    display: grid;
    gap: 6px;
    margin-bottom: 22px;
    font-size: 13px;
    color: #3a3f43;
  }

  .meta span.value {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 1px dotted var(--ink);
  }

  .meta .redact { background: var(--ink); color: var(--ink); border-bottom: none; padding: 0 6px; }

  p#description {
    font-size: 15px;
    line-height: 1.75;
    color: #22262a;
    margin-bottom: 28px;
    max-width: 62ch;
  }

  #buttons-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #buttons-container button {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 0;
    font: 600 15px/1.3 var(--mono);
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  #buttons-container button::before {
    content: '';
    flex: none;
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
  }

  #buttons-container button:hover,
  #buttons-container button:focus-visible {
    background: var(--ink);
    color: var(--paper);
    outline: none;
  }

  #buttons-container button:hover::before,
  #buttons-container button:focus-visible::before {
    background: var(--red);
    border-color: var(--red);
  }

  #buttons-container button:active { transform: translateY(1px); }

  .attempt {
    margin-top: 22px;
    padding-top: 10px;
    border-top: 1px solid rgba(22, 24, 26, 0.35);
    font-size: 12px;
    color: #4a5055;
    text-align: right;
  }

  @media (min-width: 600px) {
    .stamp { position: absolute; top: 46px; right: clamp(18px, 5vw, 32px); margin: 0; }
    h1 { padding-right: 200px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; opacity: 0.85; }
  }

  /* === 3D ЭКРАН И ИНТЕРФЕЙС === */
  #three-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: #00ff66;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 4px #00ff66;
    z-index: 2;
  }

  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 15px 20px;
    background: rgba(5, 5, 8, 0.85);
    border: 1px solid rgba(0, 255, 102, 0.4);
    color: #00ff66;
    font-size: 13px;
    pointer-events: none;
    border-radius: 4px;
    z-index: 2;
  }

  #inventory-hud {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 12px 18px;
    background: rgba(5, 5, 8, 0.85);
    border: 1px solid rgba(0, 255, 102, 0.4);
    font-size: 12px;
    pointer-events: none;
    z-index: 2;
  }

  #minimap-canvas {
    position: absolute;
    top: 20px;
    right: 20px;
    border: 1px solid #00ff66;
    background: rgba(0, 10, 5, 0.8);
    border-radius: 4px;
    z-index: 2;
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="text-game">
  <div class="card">
    <div class="dossier-bar"><span>ФОНД SCP: ОТДЕЛ KETER</span><span>ДОСЬЕ ИНЦИДЕНТА</span></div>
    <div class="stamp">СОВЕРШЕННО СЕКРЕТНО</div>
    <div class="card-body">
      <h1 id="chapter-title">ГЛАВА 1: НАРУШЕНИЕ СОДЕРЖАНИЯ</h1>
      <div class="meta">
        <div>Локация: <span class="value" id="current-location">Сектор D-12</span></div>
        <div>Испытуемый: <span class="value">D-<span class="redact">█████</span></span></div>
      </div>
      <p id="description">Загрузка данных...</p>
      <div id="buttons-container"></div>
      <div class="attempt">Попытка <span id="loop-count">#1</span></div>
    </div>
  </div>
</div>

<div id="three-container" class="hidden">
  <div class="crosshair"></div>

  <div id="hud">
    <div style="font-weight:bold; color:#fff; margin-bottom:5px;">СЕКТОР D-12 [10 ЗОН]</div>
    <div>ЗАРЯД ФОНАРЯ: <span id="battery-level" style="color:#fff;">100%</span></div>
    <div style="font-size: 11px; margin-top: 8px; color: #aaa; line-height: 1.4;">
      [W,A,S,D] — Шаг | [Shift] — Бег<br>
      [F] — Фонарик | [E] — Взаимодействие
    </div>
  </div>

  <div id="inventory-hud">
    <div style="color:#aaa; margin-bottom:3px;">ИНВЕНТАРЬ:</div>
    <div id="inv-items">Пусто</div>
  </div>

  <!-- Радар / Мини-карта -->
  <canvas id="minimap-canvas" width="120" height="120"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
