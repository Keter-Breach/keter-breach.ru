<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCP: VHS EDITION</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- VHS Оверлеи -->
  <div class="vhs-scanlines"></div>
  <div class="vhs-noise"></div>
  <div class="vhs-vignette"></div>
  <div class="vhs-tracking-line"></div>

  <!-- Текстовый UI Игры -->
  <div id="text-game" class="game-container">
    <header>
      <div class="vhs-tag">● REC 00:00:00 [TAPE_SCP_19]</div>
      <h1 id="chapter-title">ГЛАВА 1: ПРОСЫПАНИЕ</h1>
      <div id="status-bar">
        <span>Объект: <strong>D-4126</strong></span>
        <span>Статус: <strong id="current-location">Камера сдерживания</strong></span>
        <span>Цикл: <strong id="loop-count">#1</strong></span>
      </div>
    </header>

    <main id="screen">
      <p id="description">Загрузка протокола...</p>
    </main>

    <section id="controls">
      <h3>Выберите действие:</h3>
      <div id="buttons-container" class="btn-grid"></div>
    </section>
  </div>

  <!-- 3D UI Игры -->
  <div id="three-container" class="hidden">
    <div class="vhs-tag ui-overlay" id="3d-chapter-tag">● REC 00:04:13 | ГЛАВА 2: 3D СЕКТОР</div>
    <div id="battery-hud">ФОНАРИК [F]: <span id="battery-level">100%</span></div>
    <div id="crosshair">+</div>
    <div id="instructions">
      Кликните по экрану для обзора мышью<br>
      <strong>[W, A, S, D]</strong> — Ходьба | <strong>[F]</strong> — Фонарик | <strong>[E]</strong> — Исследовать
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
