 <circle cx="240" cy="310" r="1.4"/><circle cx="425" cy="490" r="1"/><circle cx="550" cy="370" r="1.2"/>
 <circle cx="820" cy="460" r=".9"/><circle cx="990" cy="310" r="1.1"/><circle cx="1500" cy="325" r="1"/>
 <circle cx="1630" cy="480" r="1.3"/><circle cx="1780" cy="550" r=".9"/><circle cx="910" cy="710" r="1.1"/>
 <circle cx="1450" cy="735" r="1.2"/><circle cx="720" cy="600" r=".8"/><circle cx="1850" cy="830" r="1"/>
