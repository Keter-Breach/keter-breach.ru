<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="ceiling" x2="0" y2="1"><stop stop-color="#171d20"/><stop offset="1" stop-color="#050708"/></linearGradient>
  <linearGradient id="left-wall" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#050708"/><stop offset=".55" stop-color="#151c1f"/><stop offset="1" stop-color="#080b0d"/></linearGradient>
  <linearGradient id="right-wall" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#090d0f"/><stop offset=".6" stop-color="#242b2e"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#303638"/><stop offset=".3" stop-color="#151a1c"/><stop offset="1" stop-color="#020303"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080b0c"/><stop offset=".24" stop-color="#333a3d"/><stop offset=".48" stop-color="#111719"/><stop offset=".7" stop-color="#3b4245"/><stop offset="1" stop-color="#07090a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273c40" stop-opacity=".82"/><stop offset=".5" stop-color="#10191c" stop-opacity=".8"/><stop offset="1" stop-color="#090d0f" stop-opacity=".96"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff342d" stop-opacity=".45"/><stop offset="1" stop-color="#ff342d" stop-opacity="0"/></linearGradient>
  <radialGradient id="alarm-glow"><stop stop-color="#ff342d" stop-opacity=".75"/><stop offset=".35" stop-color="#9f1714" stop-opacity=".24"/><stop offset="1" stop-color="#9f1714" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette"><stop offset=".1" stop-color="#000" stop-opacity="0"/><stop offset=".62" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".88"/></radialGradient>
  <linearGradient id="wet-reflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd2b26" stop-opacity=".34"/><stop offset="1" stop-color="#bd2b26" stop-opacity="0"/></linearGradient>
  <pattern id="panels" width="160" height="120" patternUnits="userSpaceOnUse"><path d="M0 0H160M0 0V120" stroke="#aab5b4" stroke-opacity=".08" stroke-width="2"/><path d="M22 25h38M105 83h28" stroke="#bac4c0" stroke-opacity=".07" stroke-width="2"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="haze"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="18"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer></filter>
</defs>
<!-- D-12 containment corridor, framed from a low security-camera angle -->
<rect width="1920" height="1080" fill="#030506"/>
<path d="M0 0H1920L1390 350H620Z" fill="url(#ceiling)"/>
<path d="M0 0L620 350V790L0 1080Z" fill="url(#left-wall)"/>
<path d="M1920 0L1390 350V790L1920 1080Z" fill="url(#right-wall)"/>
<path d="M620 350H1390V790H620Z" fill="#060809"/>
<path d="M0 1080L620 790H1390L1920 1080Z" fill="url(#floor)"/>
<path d="M0 0L620 350V790L0 1080ZM1920 0L1390 350V790L1920 1080Z" fill="url(#panels)" opacity=".72"/>
<!-- Long ceiling rails and hanging service conduits -->
<g fill="none" stroke-linecap="square">
 <path d="M0 105H1920M0 136H1920" stroke="#020303" stroke-width="18"/>
 <path d="M0 104H1920M0 136H1920" stroke="#657071" stroke-opacity=".3" stroke-width="3"/>
