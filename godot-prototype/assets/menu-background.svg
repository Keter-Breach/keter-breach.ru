 <path d="M1135 842L1080 1010M1170 858L1130 1030M1330 865L1380 1020" stroke="#d14a3f" stroke-opacity=".12" stroke-width="5"/>
 <path d="M150 1010L330 1005M460 960L590 957M1460 955L1590 961M1680 1020L1840 1025" stroke="#9ba6a0" stroke-opacity=".14" stroke-width="3"/>
</g>
<!-- Tiny status LEDs, hanging cables and atmospheric particles -->
<g fill="none" stroke="#798581" stroke-opacity=".25" stroke-width="3">
 <path d="M1700 0V90L1712 106V170M1740 0V66L1728 84V142M270 0V68L284 82V145"/>
 <path d="M155 260l38 12M165 278l24 7M1640 290l45 -12M1660 307l27 -8"/>
</g>
