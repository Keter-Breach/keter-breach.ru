<g fill="none" stroke-linecap="round">
 <path d="M620 790L0 1080M1390 790L1920 1080" stroke="#737e7c" stroke-opacity=".18" stroke-width="5"/>
 <path d="M720 804L380 1080M1290 804L1580 1080" stroke="#8c9893" stroke-opacity=".1" stroke-width="3"/>
