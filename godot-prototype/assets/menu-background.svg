 <rect x="1248" y="520" width="14" height="100" fill="#030405"/>
 <rect x="1282" y="520" width="14" height="100" fill="#030405"/>
 <path d="M1250 530H1260M1284 530H1294" stroke="#c5d0ca" stroke-opacity=".25" stroke-width="2"/>
 <rect x="1212" y="338" width="122" height="20" rx="2" fill="#fa3028"/>
 <rect x="1180" y="326" width="186" height="42" fill="#f52a23" opacity=".24" filter="url(#haze)"/>
 <ellipse cx="1274" cy="360" rx="330" ry="180" fill="url(#alarm-glow)" filter="url(#blur)"/>
 <path d="M1210 363L1030 820H1510L1330 363Z" fill="url(#beam)" opacity=".4"/>
 <path d="M1070 785H1480L1450 806H1100Z" fill="#020303" stroke="#68716f" stroke-opacity=".25" stroke-width="3"/>
 <g fill="#0a0d0e" stroke="#b0bbb4" stroke-opacity=".35" stroke-width="2">
  <circle cx="1075" cy="370" r="5"/><circle cx="1475" cy="370" r="5"/>
  <circle cx="1075" cy="765" r="5"/><circle cx="1475" cy="765" r="5"/>
 </g>
</g>
<!-- Observation glass and warning panel on the far-right wall -->
<g>
 <path d="M1540 380H1795V660H1540Z" fill="#080b0d" stroke="#535d5e" stroke-width="10"/>
